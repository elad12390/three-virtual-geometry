<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>three-virtual-geometry from a CDN (minimal build)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #111; color: #eee; font: 14px/1.5 system-ui, sans-serif; }
      canvas { display: block; }
      #status { position: fixed; left: 12px; top: 10px; pointer-events: none; text-shadow: 0 1px 4px #000; }
    </style>

    <!--
      1. The import map tells the browser where each package lives. Everything comes from jsDelivr, which serves any
         npm package. The minimal build of three-virtual-geometry does not contain three.js: it imports "three/webgpu"
         and "three/tsl", and this map points them at your copy of three.js. "three" and "three/webgpu" point to the
         same file, so the whole page shares ONE copy of three.js (addons such as GLTFLoader import "three").
    -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
          "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
          "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/",
          "three-virtual-geometry": "https://cdn.jsdelivr.net/npm/three-virtual-geometry@0.1/dist/three-virtual-geometry.min.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="status">Loading…</div>

    <!-- 2. Your code: a module script, so it can use the names from the import map. -->
    <script type="module">
      import * as THREE from 'three/webgpu';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
      import { VirtualGeometry } from 'three-virtual-geometry';

      const status = document.getElementById('status');

      // WebGPU is required. Without it, say so instead of failing silently.
      if (!navigator.gpu) {
        status.textContent = 'This browser has no WebGPU. Use Chrome or Edge 113+, or Safari 26+.';
        throw new Error('WebGPU not available');
      }

      // A normal three.js WebGPU setup.
      const renderer = new THREE.WebGPURenderer({ antialias: true });
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      renderer.setSize(innerWidth, innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      document.body.appendChild(renderer.domElement);
      await renderer.init(); // must finish before the first render

      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xc9d3dc);
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      const sun = new THREE.DirectionalLight(0xffffff, 2);
      sun.position.set(30, 50, 20);
      scene.add(sun);
      const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshStandardNodeMaterial({ color: 0x3a3d42 }));
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);
      const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 1000);
      camera.position.set(14, 9, 34);
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // 3. One VirtualGeometry for the whole app.
      const vg = new VirtualGeometry();

      // 4. Load a model as usual. (Taxi from the Kenney Car Kit, CC0, hosted with these docs.)
      const url = 'https://elad12390.github.io/three-virtual-geometry/demo/models/kenney-car-kit/taxi.glb';
      const gltf = await new GLTFLoader().loadAsync(url);

      //    Place 400 copies. vg.add() notices they share geometry and draws them as one instanced mesh.
      const city = new THREE.Group();
      for (let x = 0; x < 20; x++) {
        for (let z = 0; z < 20; z++) {
          const taxi = gltf.scene.clone();
          taxi.position.set((x - 9.5) * 3, 0, (z - 9.5) * 5);
          taxi.rotation.y = Math.random() * Math.PI * 2;
          city.add(taxi);
        }
      }

      //    Hand it to vg.add() before adding it to the scene: every static mesh inside becomes virtual geometry,
      //    with its materials and textures. It resolves once the meshes are built.
      status.textContent = 'Building…';
      await vg.add(city, { onProgress: (f) => (status.textContent = `Building… ${Math.round(f * 100)}%`) });
      scene.add(city);

      // 5. Optional: compile GPU pipelines now, so the first frames don't stutter.
      await vg.compileAsync(renderer, scene, camera);

      addEventListener('resize', () => {
        camera.aspect = innerWidth / innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(innerWidth, innerHeight);
      });

      // 6. Render as usual. Level of detail and culling run automatically before every render.
      renderer.setAnimationLoop(() => {
        controls.update();
        renderer.render(scene, camera);
      });

      // Optional: show what the GPU draws. vg.lastStats refreshes every few frames.
      setInterval(() => {
        const s = vg.lastStats;
        if (s) status.textContent = `${s.drawnTriangles.toLocaleString()} of ${s.fullDetailTriangles.toLocaleString()} triangles drawn · drag to orbit, scroll to zoom`;
      }, 500);
    </script>
  </body>
</html>
